# Local Postgres + app:  docker compose up --build
services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: nafdac, POSTGRES_PASSWORD: nafdac, POSTGRES_DB: nafdac}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nafdac:nafdac@db:5432/nafdac
    ports: ["8000:8000"]
    depends_on: [db]
volumes: {pgdata: {}}
